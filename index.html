<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>5 алгоритмов на графах</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon-light.png">
</head>
<body>
    <div class="app">
        <h1>
            <img src="logo.png" alt="5 алгоритмов на графах" style="height: 100px;">
        </h1>

        <div class="taskbar" id="taskbar">
            <button class="task-btn active" data-task="0">1. Сильная связность</button>
            <button class="task-btn" data-task="1">2. Фронт волны</button>
            <button class="task-btn" data-task="2">3. Форд-Беллман</button>
            <button class="task-btn" data-task="3">4. Эйлерова цепь</button>
            <button class="task-btn" data-task="4">5. Мин. остовное дерево</button>
        </div>

        <div class="control-panel">
            <div class="slider-container">
                <label> Вершины:</label>
                <input type="range" id="nodeSlider" min="4" max="8" step="1" value="5">
                <span id="nodeCountValue">5</span>
            </div>
            <button class="regenerate" id="regenerateBtn"> Сгенерировать новый граф</button>
        </div>

        <div class="main-panel">
            <div class="graph-container" style="position: relative;">
                <button class="canvas-help-btn" id="helpBtn" title="Показать подсказку">?</button>
                <canvas id="graphCanvas" width="520" height="360"></canvas>
            </div>
            <div class="answer-panel" id="answerPanel"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Подсказка</h3>
            <div id="modalBody"></div>
            <button class="modal-close" id="modalClose">Закрыть</button>
        </div>
    </div>

    <div id="solutionModal" class="modal">
        <div class="modal-content solution-content">
            <h3 id="solutionModalTitle"> Пошаговое решение</h3>
            <div id="solutionModalBody"></div>
            <button class="modal-close" id="solutionModalClose">Закрыть</button>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>

    <script src="js/graph.js"></script>
    <script src="js/algorithms/scc.js"></script>
    <script src="js/algorithms/wave.js"></script>
    <script src="js/algorithms/fordBellman.js"></script>
    <script src="js/algorithms/euler.js"></script>
    <script src="js/algorithms/mst.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/generators.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/check.js"></script>
    <script src="js/solution.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
